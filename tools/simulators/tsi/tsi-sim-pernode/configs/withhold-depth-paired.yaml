# PAIRED deeper rules and re-rooting against a withholding coalition (PLAN.md Phase 4, the report's
# section 6.4): the coalition publishes none of its blocks, so no rule can count them. The spec
# 1.2.5 rule at depth 1 against cousins (2), the ceiling (0), and re-rooting by all the honest
# stake 10 slots after detection. adversary_frac 0 / 0.2 / 0.4 at delta_max 4 and 8.
#
# paired_streams gives every arm the SAME stake draw, peering graph, coalition and lottery
# outcomes. Analysis: scripts/adversary_analysis.py.
#
# Latency is in SLOTS (1 slot = 1 s).
n_nodes: [1000]                              # network size
stake_dist: [pareto]                         # heavy-tailed (realistic) stake distribution
topology: [blend]                            # Blend mixnet (the multi-slot fork regime)
degree: [6]                                  # peering degree of the d-regular graph
link_latency_mean: [0.5]                     # natural geographic transport (sub-slot)
link_latency_dist: [geo]                     # real-world geographic band mixture
blend_hops: [3]                              # fixed hop count; delay is the swept knob
blend_delay_max: [4.0, 8.0]                  # max per-relay mixing delay (slots)
max_uncles: [4]                              # U: the spec cap
uncle_strategy: [oldest]                     # spec selection: oldest-first fill
uncle_window_anchor: [parent]                # spec 1.2.5: window measured to the fork point
window_absorption: [12.0]                    # spec 1.2.5: W = 12 block-intervals (360 slots)
uncle_order: [parent]                        # spec 1.2.5: oldest fork point first
init_dest: [common]                          # per-node initial D_est from agreement
uncle_depth: [1, 2, 0]                       # depth arms; re-rooting runs at depth 1 only
reroot_share: [0.0, 1.0]                     # share of the honest stake that re-roots
reroot_delay: [10.0]                         # slots from detection to publication
adversary_frac: [0.0, 0.2, 0.4]              # stake share of the withholding coalition
replicates: 20
base:                                        # per-run settings shared by every cell
  k: 256                                     # the geometry of the selfish runs
  epochs: 20                                 # equilibrium within ~2 epochs; burn 50%
  f: 0.03333333333333333                     # slot activation coefficient (1/30)
  genesis_d_factor: 0.5                      # start near true stake (cheap epoch 0)
  early_stop: true
  paired_streams: true                       # common random numbers across the arms
  adversary_strategy: withhold               # publishes none of its blocks
