# PAIRED route C arm over the overload grid (PLAN.md Phase 2c): a reference counts by its lottery
# win alone, so at any depth (uncle_depth 0) with the window measured to the entry's own slot
# (uncle anchor) and entries taken by their own slot (uncle order). delta_max 4/8/16/32 (rho ~ 0.36
# to 1.76).
#
# paired_streams gives this arm the SAME stake draw, peering graph and lottery outcomes as every
# arm of configs/depth-overload-paired.yaml, so the two runs pair replicate by replicate. U = 0 is
# the identity check: with no uncles no rule is consulted, so it must reproduce the Phase 2 rows.
# Analysis: scripts/route_c_analysis.py honest, with the Phase 2 run, the Phase 2b run and the run
# of configs/routec-order-overload-paired.yaml.
#
# Latency is in SLOTS (1 slot = 1 s).
n_nodes: [1000]                              # network size
stake_dist: [pareto]                         # heavy-tailed (realistic) stake distribution
topology: [blend]                            # Blend mixnet (the multi-slot fork regime)
degree: [6]                                  # peering degree of the d-regular graph
link_latency_mean: [0.5]                     # natural geographic transport (sub-slot)
link_latency_dist: [geo]                     # real-world geographic band mixture
blend_hops: [3]                              # fixed hop count; delay is the swept knob
blend_delay_max: [4.0, 8.0, 16.0, 32.0]      # max per-relay mixing delay (slots)
max_uncles: [0, 1, 2, 4]                     # U: 0 identity check, then the recovery levers
uncle_strategy: [oldest]                     # spec selection: oldest-first fill
uncle_window_anchor: [uncle]                 # route C: window measured to the entry's own slot
window_absorption: [12.0]                    # spec 1.2.5: W = 12 block-intervals (360 slots)
uncle_order: [uncle]                         # route C: oldest entry first
init_dest: [common]                          # per-node initial D_est from agreement
uncle_depth: [0]                             # route C: any depth, no ancestry condition
replicates: 20
base:                                        # per-run settings shared by every cell
  k: 2160                                    # true security parameter
  epochs: 20                                 # equilibrium within ~2 epochs; burn 50%
  f: 0.03333333333333333                     # slot activation coefficient (1/30)
  genesis_d_factor: 0.5                      # start near true stake (cheap epoch 0)
  early_stop: true
  paired_streams: true                       # common random numbers with the Phase 2 arms
