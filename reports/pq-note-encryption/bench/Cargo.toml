[package]
name = "pq-note-encryption-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
x-wing = { version = "0.1.1", features = ["getrandom"] }
x25519-dalek = { version = "3", features = ["static_secrets"] }
chacha20poly1305 = "0.11"
blake2 = "0.11"
getrandom = "0.3"
kem = "0.3"

libcrux-ml-kem = "0.0.11"
ml-kem = { version = "0.3", features = ["getrandom"] }

[profile.release]
opt-level = 3
[[bin]]
name = "pq-note-encryption-bench"
path = "src/main.rs"

[[bin]]
name = "mlkem-libs"
path = "src/mlkem_libs.rs"
