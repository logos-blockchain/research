[package]
name = "pow-bench"
version = "0.0.0"
edition = "2021"

[dependencies]
logos-blockchain-poseidon2 = { path = "../../../../logos-blockchain/zk/poseidon2" }
ark-bn254 = { version = "0.5", default-features = false, features = ["scalar_field"] }
ark-ff = { version = "0.5", default-features = false }
jf-poseidon2 = { git = "https://github.com/EspressoSystems/jellyfish.git", rev = "8d80230358e900f8d63765a937f63f4978ca1daa", default-features = false, features = ["bn254"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
